<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RangeCard — Warm up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#96D6E2}a:hover{color:#ADE0EA}
button:focus-visible,a:focus-visible{outline:3px solid #96D6E2;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #0B0E18; color: #F2F5F9; font-family: 'Manrope', system-ui, sans-serif; position: relative; overflow: hidden">

<div style="padding: 22px 22px 16px; border-bottom: 1px solid #222839; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 28px">Warm up</h1>
<a href="Log.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 6px; color: #C3CBD8; text-decoration: none; font-size: 15px; font-weight: 600">Skip</a>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #9AA4B4">MOBILITY ROUTINE</span>
<span style="font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 700; font-size: 15px">{{progressLabel}}</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #232A3B; overflow: hidden"><div style="{{barStyle}}"></div></div>
</div>

<div style="padding: 20px 22px 132px; display: flex; flex-direction: column; gap: 22px">

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<section aria-label="Current movement" style="background: #161B29; border: 1px solid rgba(150,214,226,0.38); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 196px; border-radius: 20px; background: #1E2433; display: flex; align-items: center; justify-content: center; position: relative">
<span style="position: absolute; top: 12px; left: 14px; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #96D6E2">NOW</span>
<svg viewBox="0 0 120 120" width="180" height="180" role="img" aria-label="{{cur.alt}}">
<line x1="14" y1="108" x2="106" y2="108" stroke="#2E3547" stroke-width="2" stroke-linecap="round"></line>
<path d="{{cur.motion}}" fill="none" stroke="#96D6E2" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"></path>
<path d="{{cur.club}}" fill="none" stroke="#96D6E2" stroke-width="3" stroke-linecap="round"></path>
<path d="{{cur.body}}" fill="none" stroke="#F2F5F9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="{{cur.hx}}" cy="{{cur.hy}}" r="7.5" fill="#F2F5F9"></circle>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 24px">{{cur.name}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #C3CBD8">{{cur.how}}</p>
</div>
<div style="display: flex; gap: 10px">
<button onClick="{{done}}" style="flex: 1; min-height: 54px; border: none; border-radius: 20px; background: #96D6E2; color: #0F1321; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Done</button>
<button onClick="{{done}}" aria-label="Skip this movement" style="width: 54px; min-height: 54px; border-radius: 20px; border: 1px solid #2E3547; background: #1E2433; color: #C3CBD8; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18l7-6-7-6M13 18l7-6-7-6"></path></svg></button>
</div>
</section>
</sc-if>

<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<section style="background: #161B29; border: 1px solid rgba(150,214,226,0.38); border-radius: 26px; padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="rgba(150,214,226,0.14)"></circle><path d="M20 33l8 8 16-18" fill="none" stroke="#96D6E2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h2 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 24px">Loose and ready</h2>
<p style="margin: 0; font-size: 15px; color: #C3CBD8">All seven done. Your body will thank you on ball one.</p>
<button onClick="{{reset}}" style="min-height: 44px; border: none; background: transparent; color: #96D6E2; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Start over</button>
</section>
</sc-if>

<sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #9AA4B4">STILL TO COME</span>
<ul style="list-style: none; margin: 0; padding: 0; background: #161B29; border: 1px solid #222839; border-radius: 22px; overflow: hidden">
<sc-for list="{{next}}" as="w" hint-placeholder-count="6">
<li style="{{w.row}}">
<span style="width: 46px; height: 46px; flex: none; border-radius: 14px; background: #1E2433; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 120 120" width="40" height="40" aria-hidden="true">
<path d="{{w.club}}" fill="none" stroke="#96D6E2" stroke-width="5" stroke-linecap="round"></path>
<path d="{{w.body}}" fill="none" stroke="#C3CBD8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="{{w.hx}}" cy="{{w.hy}}" r="9" fill="#C3CBD8"></circle>
</svg>
</span>
<span style="font-size: 16px; font-weight: 600">{{w.name}}</span>
</li>
</sc-for>
</ul>
</div>
</sc-if>

<a href="Log.dc.html" style="min-height: 60px; border-radius: 22px; background: #1E2433; border: 1px solid #2E3547; color: #F2F5F9; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 17px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>I'm ready, start logging</a>

</div>

<nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 4px; padding: 8px; border-radius: 40px; background: #161B29; border: 1px solid #222839; box-shadow: 0 18px 40px -12px rgba(2,4,10,0.7)">
<a href="Main.dc.html" aria-label="Plan" style="width: 56px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #9AA4B4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg></a>
<a href="Log.dc.html" style="height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-radius: 26px; background: rgba(150,214,226,0.17); color: #96D6E2; text-decoration: none; font-weight: 700; font-size: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M12 15v6M9 21h6"></path></svg>Log</a>
<a href="Main.dc.html" aria-label="Round" style="width: 56px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #9AA4B4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20V3l6 3-6 3M6 20h9"></path></svg></a>
<a href="Main.dc.html" aria-label="More" style="width: 56px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #9AA4B4"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0 };
  }
  renderVals() {
    var self = this;
    var P = [
      { name: 'Shoulders', how: 'Hold the club at the bottom of the grip and circle arm and club around the shoulder, 5–6 times each way, one arm at a time.', alt: 'Figure circling a club around one shoulder', hx: 60, hy: 22,
        body: 'M60 31 L60 66 M60 66 L52 106 M60 66 L68 106 M60 36 L50 52 L48 66 M60 36 L84 24', club: 'M84 24 L100 8', motion: 'M90 36 A30 30 0 1 1 60 6' },
      { name: 'Upper arms & sides', how: 'Club above your head, feet apart. Bend gently to each side.', alt: 'Figure bending sideways with a club held overhead', hx: 72, hy: 22,
        body: 'M58 70 Q58 50 66 32 M58 70 L46 106 M58 70 L72 106 M66 34 L56 16 M66 34 L84 22', club: 'M48 12 L94 24', motion: 'M90 52 Q100 36 96 18' },
      { name: 'Back', how: 'Hold the club at both ends, bend over with one hand on a knee and turn the other hand and club outward. Then the other side.', alt: 'Figure bent over, one hand on knee, turning a club upward', hx: 90, hy: 40,
        body: 'M50 66 L80 46 M50 66 L44 106 M50 66 L62 106 M78 48 L64 84 M80 46 L84 20', club: 'M72 14 L98 26', motion: 'M98 8 A16 16 0 0 1 108 34' },
      { name: 'Legs', how: 'One leg in front, front knee bent, back leg straight. Let the back heel touch down gently. Both sides.', alt: 'Figure in a lunge stretching the back leg', hx: 58, hy: 20,
        body: 'M58 29 L60 62 M60 62 L80 82 L82 106 M60 62 L34 106 M59 36 L54 60 M59 36 L64 60', club: 'M0 0', motion: 'M28 86 L32 100' },
      { name: 'Ankles & calves', how: 'Lift one foot and slowly rotate it. Both legs.', alt: 'Figure on one leg rotating the other ankle', hx: 56, hy: 20,
        body: 'M56 29 L58 66 M58 66 L56 106 M58 66 L72 84 L80 88 M57 36 L48 60 M57 36 L66 60', club: 'M0 0', motion: 'M90 88 A10 10 0 1 1 80 76' },
      { name: 'Body turn', how: 'Club behind your neck, held at both ends. Turn hips and shoulders, head as still as you can.', alt: 'Figure turning with a club across the shoulders', hx: 60, hy: 20,
        body: 'M60 29 L60 66 M60 66 L50 106 M60 66 L70 106 M60 34 L42 42 L36 32 M60 34 L78 42 L84 32', club: 'M28 32 L92 32', motion: 'M32 58 Q60 76 88 58' },
      { name: 'Forearms', how: 'Arms out in front, make fists and rotate the wrists.', alt: 'Figure with arms out front rotating the wrists', hx: 50, hy: 20,
        body: 'M50 29 L52 66 M52 66 L46 106 M52 66 L58 106 M51 36 L88 40', club: 'M87 40 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0', motion: 'M100 28 A12 12 0 1 1 84 50' }
    ];
    var idx = this.state.idx;
    var n = P.length;
    var next = P.slice(idx + 1).map(function (p, i) {
      return { name: p.name, body: p.body, club: p.club, hx: p.hx, hy: p.hy,
        row: 'display: flex; align-items: center; gap: 14px; padding: 10px 14px;' + (i > 0 ? ' border-top: 1px solid #222839' : '') };
    });
    return {
      cur: P[Math.min(idx, n - 1)],
      next: next,
      hasNext: next.length > 0,
      notDone: idx < n,
      allDone: idx >= n,
      progressLabel: Math.min(idx, n) + ' of ' + n,
      barStyle: 'height: 100%; border-radius: 3px; background: #96D6E2; width: ' + Math.round(Math.min(idx, n) / n * 100) + '%',
      done: function () { self.setState({ idx: idx + 1 }); },
      reset: function () { self.setState({ idx: 0 }); }
    };
  }
}
</script>
</body>
</html>
