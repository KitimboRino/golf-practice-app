<div style="position: relative; height: 290px; overflow: hidden">
<img src="/photos/course-sunset.webp" alt="A green framed by a raked bunker at sunset, flags in the distance and hills behind" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,24,0.1) 0%, rgba(11,14,24,0.2) 45%, rgba(11,14,24,0.88) 86%, #0B0E18 100%)"></div>
<div style="position: absolute; left: 22px; right: 22px; bottom: 16px; display: flex; flex-direction: column; gap: 4px">

<span style="font-size: 15px; color: #C3CBD8">On-course stats, hole by hole</span>
</div>
</div>

<div style="padding: 12px 18px 132px; display: flex; flex-direction: column; gap: 16px">

<button role="radio" aria-checked="false" style="min-height: 84px; border-radius: 22px; border: 1px solid #222839; background: #161B29; color: #F2F5F9; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center">

<span style="font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 30px">18</span><span style="font-size: 14px">holes</span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #9AA4B4">COURSE · PAR PRE-FILLED</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #96D6E2; background: rgba(150,214,226,0.14); color: #96D6E2; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Uganda Golf Club</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2E3547; background: #161B29; color: #F2F5F9; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Entebbe Golf Club</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2E3547; background: #161B29; color: #F2F5F9; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Lake Victoria Serena</button>
<button style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px dashed #2E3547; background: transparent; color: #C3CBD8; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">+ Another course</button>
</div>
</div>

<button style="min-height: 58px; border: none; border-radius: 22px; background: #96D6E2; color: #0F1321; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Tee off · 18 holes</button>

<a href="Fixes.dc.html" style="display: flex; align-items: stretch; border-radius: 22px; overflow: hidden; background: #161B29; border: 1px solid #222839; text-decoration: none; color: #F2F5F9; min-height: 104px">
<img src="/photos/aerial-green.webp" alt="" style="width: 112px; flex: none; object-fit: cover">
<span style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px">
<strong style="font-size: 16px">Course management</strong>
<span style="font-size: 13px; line-height: 1.4; color: #C3CBD8">Where to aim off the tee, which pins to avoid, how to get out of trouble.</span>
</span>
</a>

<div style="border-radius: 22px; border: 1px dashed #2E3547; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 16px">Where you're losing shots</strong>
<span style="font-size: 14px; line-height: 1.5; color: #C3CBD8">Play two rounds and this fills in: driving, approach, short game and putting, ranked worst first.</span>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 4px; padding: 8px; border-radius: 40px; background: #161B29; border: 1px solid #222839; box-shadow: 0 18px 40px -12px rgba(2,4,10,0.7)">

<a href="Round.dc.html" style="height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-radius: 26px; background: rgba(150,214,226,0.17); color: #96D6E2; text-decoration: none; font-weight: 700; font-size: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20V3l6 3-6 3M6 20h9"></path></svg>Round</a>
<a href="Games.dc.html" aria-label="More" style="width: 56px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 26px; color: #9AA4B4"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></a>
