name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Next 16: generate route types first (next-env.d.ts references them)
      - run: npm run typecheck
      - run: npx next build
        env:
          NODE_ENV: production

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Blocks the build on a critical advisory.
      - run: npm audit --omit=dev --audit-level=critical
      # Blocks on high advisories too — clean since the Next 16 upgrade
      # (next-pwa is long gone; it was the old source of build-time highs).
      - run: npm audit --omit=dev --audit-level=high
